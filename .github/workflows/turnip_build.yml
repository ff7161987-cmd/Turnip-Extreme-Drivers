name: Build Turnip Extreme Performance

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip
          pip3 install --break-system-packages meson mako

      - name: Build Drivers
        run: |
          chmod +x build_turnip.sh
          export BUILD_VERSION="26.3.0-R2"
          ./build_turnip.sh

      - name: Prepare Final Package
        run: |
          mkdir -p final_package/gen8
          cd final_package/gen8
          unzip ../../turnip_workdir/turnip-gen8-*.zip
          zip -9 ../../Turnip-Extreme-A6xx-A7xx-A8xx-v26.3.0-R2.zip libvulkan_freedreno.so meta.json

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Extreme-Driver
          path: Turnip-Extreme-*.zip

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v26.3.0-R2
          name: Turnip Extreme Performance v26.3.0-R2
          body: |
            Driver Turnip Otimizado para Performance Extrema (ETS 2 Fix Build)
            - Einstein Surgery: Fixed Threads for 8 Cores
            - Memory Alignment (64 bytes - Stable)
            - Barrier Minimization (Reduced Latency)
            - Aggressive DCE (Dead Code Elimination)
            - Shader Prefetch Boost
            - Reverted: No-Wait Sync & Fast-Path Blending (Fix Black Screen)
            - LTO + Optimization Level 3
            - Suporte Adreno 6xx/7xx/8xx
          files: Turnip-Extreme-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Turnip Extreme Performance

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip
          pip3 install --break-system-packages meson mako

      - name: Build Drivers
        run: |
          chmod +x build_turnip.sh
          export BUILD_VERSION="26.4.0"
          ./build_turnip.sh

      - name: Prepare Final Package
        run: |
          mkdir -p final_package/gen8
          cd final_package/gen8
          unzip ../../turnip_workdir/turnip-gen8-*.zip
          zip -9 ../../Turnip-Extreme-Universal-v26.4.0.zip libvulkan_freedreno.so meta.json $([ -f libvulkan_panfrost.so ] && echo "libvulkan_panfrost.so")

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Extreme-Driver
          path: Turnip-Extreme-*.zip

      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v26.4.0
          name: Turnip Extreme Performance v26.4.0 (Universal God Mode)
          body: |
            Driver Turnip + Mali Otimizado para Performance Extrema (Universal God Mode)
            - Universal NIR Algebraics (Boost para Adreno & Mali)
            - Global Memory Pool Aggression (Reduced Stuttering)
            - Loop Unrolling Boost (limit=64)
            - Mali/MediaTek Specific Hacks (Panfrost Optimization)
            - Adreno Turbo Binning (Concurrent + HIPRIO)
            - Ultra-Aggressive IR3 Scheduling
            - Einstein Surgery: Fixed Threads for 8 Cores
            - LTO + Optimization Level 3
            - Suporte Adreno 6xx/7xx/8xx & Mali (Bifrost/Valhall)
          files: Turnip-Extreme-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
